name: 问题反馈
description: 清理没效果、报错、界面异常等问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### 先看这几条，能省一次往返
        - **「清完可用内存没涨」通常是正常现象**：待命缓存本来就计入「可用内存」，清掉它只是 standby → free。
          真正让这个数字上升的是 L5（清空工作集），代价是各程序重新读盘。详见 README「关于释放内存的诚实说明」。
        - **「提交量」接近上限时，清缓存没有任何帮助**，需要排查占用内存的进程或增大页面文件。
        - **L4 之后待命缓存不该变大**：如果你用的版本是 v1.0.0 之前自行编译的，请先更新到最新 Release。

  - type: input
    id: os
    attributes:
      label: Windows 版本
      placeholder: "Win11 25H2 (26100.xxxx)"
    validations:
      required: true

  - type: input
    id: ram
    attributes:
      label: 物理内存
      placeholder: "32 GB DDR5-5600"
    validations:
      required: true

  - type: dropdown
    id: level
    attributes:
      label: 使用的清理级别
      options:
        - L1 轻度
        - L2 标准
        - L3 深度
        - L4 极限
        - L5 全系统
        - 不确定 / 自动推荐的
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 程序版本
      description: Release 页面上的 tag；如果是自己编译的，请贴 exe 的 SHA256
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: textarea
    id: numbers
    attributes:
      label: 清理前后的数字
      description: 抄界面上的「可用 / 待命缓存 / 已修改 / 已提交」，或直接复制窗口底部日志框的内容
      placeholder: |
        清理前：可用 24.59 GB，待命缓存 5.09 GB，已提交 21.65 / 35.67 GB
        清理后：可用 24.42 GB，待命缓存 476 KB
        日志：12:00:01.123  开始 L2 标准 清理 …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你期望发生什么，实际发生了什么
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我读过了 README 里关于「待命缓存 / 可用内存」的说明
          required: true
        - label: 我提供的是 Release 里的版本（或已说明是自己编译的）
          required: true
